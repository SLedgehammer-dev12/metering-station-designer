name: Build Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    # v1.2.0 (both) and v1.2.0-win (Windows only) build Windows; -mac skips it.
    if: ${{ !contains(github.ref, '-mac') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate VERSION file
        shell: bash
        run: |
          python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])" > VERSION

      - name: Build with PyInstaller
        shell: cmd
        run: |
          pyinstaller --onedir --console --name MeteringStationDesigner --add-data "knowledge;knowledge" --add-data "VERSION;." --hidden-import=streamlit --hidden-import=plotly --hidden-import=pyaga8 --hidden-import=CoolProp --hidden-import=fluids --hidden-import=thermo --hidden-import=openpyxl --hidden-import=reportlab streamlit_app/app.py

      - name: Verify and Zip
        run: |
          dir dist\MeteringStationDesigner\
          7z a MeteringStationDesigner_Windows.zip .\dist\MeteringStationDesigner\*

      - name: Upload to Release
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "Uploading to release tag: $tag"
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" -Headers @{Authorization="Bearer ${{ secrets.GITHUB_TOKEN }}"}
          $uploadUrl = $release.upload_url -replace '{.*}','?name=MeteringStationDesigner_Windows.zip'
          Invoke-RestMethod -Uri $uploadUrl -Method Post -Headers @{Authorization="Bearer ${{ secrets.GITHUB_TOKEN }}"; "Content-Type"="application/zip"} -InFile MeteringStationDesigner_Windows.zip

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    # v1.2.0 (both) and v1.2.0-mac (macOS only) build macOS; -win skips it.
    if: ${{ !contains(github.ref, '-win') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate VERSION file
        run: |
          python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])" > VERSION

      - name: Build with PyInstaller (.app bundle)
        run: |
          pyinstaller --windowed --name MeteringStationDesigner --add-data "knowledge:knowledge" --add-data "VERSION:." --hidden-import=streamlit --hidden-import=plotly --hidden-import=pyaga8 --hidden-import=CoolProp --hidden-import=fluids --hidden-import=thermo --hidden-import=openpyxl --hidden-import=reportlab streamlit_app/app.py

      - name: Ad-hoc codesign
        run: |
          codesign --force --deep -s - "dist/MeteringStationDesigner.app"
          codesign --verify --deep --strict "dist/MeteringStationDesigner.app"

      - name: Build DMG
        run: |
          mkdir -p dmg_stage
          cp -R "dist/MeteringStationDesigner.app" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "MeteringStationDesigner" -srcfolder dmg_stage -ov -format UDZO MeteringStationDesigner_macOS_arm64.dmg
          ls -la MeteringStationDesigner_macOS_arm64.dmg

      - name: Upload to Release
        run: |
          tag="${{ github.ref_name }}"
          echo "Uploading to release tag: $tag"
          release=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag")
          upload_url=$(echo "$release" | python -c "import sys,json;print(json.load(sys.stdin)['upload_url'].split('{')[0])")
          curl -s -X POST "$upload_url?name=MeteringStationDesigner_macOS_arm64.dmg" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/x-apple-diskimage" \
            --data-binary "@MeteringStationDesigner_macOS_arm64.dmg"