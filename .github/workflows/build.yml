name: Build Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    # v1.2.0 (both) and v1.2.0-win (Windows only) build Windows; -mac skips it.
    if: ${{ !contains(github.ref, '-mac') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate VERSION file
        shell: bash
        run: |
          python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])" > VERSION

      - name: Build with PyInstaller
        shell: cmd
        run: |
          pyinstaller --onedir --console --name MeteringStationDesigner --add-data "knowledge;knowledge" --add-data "VERSION;." --add-data "streamlit_app;streamlit_app" --add-data "metering_designer;metering_designer" --collect-all streamlit --hidden-import=plotly --hidden-import=pyaga8 --hidden-import=CoolProp --hidden-import=fluids --hidden-import=thermo --hidden-import=openpyxl --hidden-import=reportlab --hidden-import=numpy --hidden-import=pandas --hidden-import=matplotlib launcher.py

      - name: Verify bundle contents (pages + streamlit metadata)
        shell: bash
        run: |
          find dist/MeteringStationDesigner -type d -name "streamlit-*.dist-info" | grep -q . || { echo "streamlit dist-info NOT bundled"; exit 1; }
          find dist/MeteringStationDesigner -type d -path "*streamlit_app/pages" | grep -q . || { echo "streamlit_app/pages NOT bundled"; exit 1; }
          echo "bundle contents OK"

      - name: Self-test (every page must execute)
        shell: bash
        env:
          MSD_SELFTEST: "1"
        run: |
          ./dist/MeteringStationDesigner/MeteringStationDesigner.exe || { echo "SELFTEST FAILED"; exit 1; }

      - name: Launch test (real server must start)
        shell: bash
        env:
          MSD_PORT: "8599"
        run: |
          ./dist/MeteringStationDesigner/MeteringStationDesigner.exe > msd_launch.log 2>&1 &
          APP_PID=$!
          ok=0
          for i in $(seq 1 30); do
            sleep 2
            if curl -sf "http://127.0.0.1:8599/_stcore/health" | grep -q ok; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then
            echo "LAUNCH FAILED — app did not serve /_stcore/health"
            tail -60 msd_launch.log
            kill $APP_PID 2>/dev/null
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8599/")
          kill $APP_PID 2>/dev/null
          echo "main page HTTP $code"
          [ "$code" = "200" ] || exit 1

      - name: Verify and Zip
        run: |
          dir dist\MeteringStationDesigner\
          7z a MeteringStationDesigner_Windows.zip .\dist\MeteringStationDesigner\*

      - name: Upload to Release
        run: |
          $tag = "${{ github.ref_name }}"
          Write-Host "Uploading to release tag: $tag"
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" -Headers @{Authorization="Bearer ${{ secrets.GITHUB_TOKEN }}"}
          $uploadUrl = $release.upload_url -replace '{.*}','?name=MeteringStationDesigner_Windows.zip'
          Invoke-RestMethod -Uri $uploadUrl -Method Post -Headers @{Authorization="Bearer ${{ secrets.GITHUB_TOKEN }}"; "Content-Type"="application/zip"} -InFile MeteringStationDesigner_Windows.zip

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    # v1.2.0 (both) and v1.2.0-mac (macOS only) build macOS; -win skips it.
    if: ${{ !contains(github.ref, '-win') }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate VERSION file
        run: |
          python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])" > VERSION

      - name: Build with PyInstaller (.app bundle)
        run: |
          pyinstaller --windowed --name MeteringStationDesigner --add-data "knowledge:knowledge" --add-data "VERSION:." --add-data "streamlit_app:streamlit_app" --add-data "metering_designer:metering_designer" --collect-all streamlit --hidden-import=plotly --hidden-import=pyaga8 --hidden-import=CoolProp --hidden-import=fluids --hidden-import=thermo --hidden-import=openpyxl --hidden-import=reportlab --hidden-import=numpy --hidden-import=pandas --hidden-import=matplotlib launcher.py

      - name: Ad-hoc codesign
        run: |
          codesign --force --deep -s - "dist/MeteringStationDesigner.app"
          codesign --verify --deep --strict "dist/MeteringStationDesigner.app"

      - name: Verify bundle contents (pages + streamlit metadata)
        run: |
          find "dist/MeteringStationDesigner.app" -type d -name "streamlit-*.dist-info" | grep -q . || { echo "streamlit dist-info NOT bundled"; exit 1; }
          find "dist/MeteringStationDesigner.app" -type d -path "*streamlit_app/pages" | grep -q . || { echo "streamlit_app/pages NOT bundled"; exit 1; }
          echo "bundle contents OK"

      - name: Self-test (every page must execute)
        env:
          MSD_SELFTEST: "1"
        run: |
          "./dist/MeteringStationDesigner.app/Contents/MacOS/MeteringStationDesigner" || { echo "SELFTEST FAILED"; exit 1; }

      - name: Launch test (real server must start)
        env:
          MSD_PORT: "8599"
        run: |
          "./dist/MeteringStationDesigner.app/Contents/MacOS/MeteringStationDesigner" > msd_launch.log 2>&1 &
          APP_PID=$!
          ok=0
          for i in $(seq 1 30); do
            sleep 2
            if curl -sf "http://127.0.0.1:8599/_stcore/health" | grep -q ok; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then
            echo "LAUNCH FAILED — app did not serve /_stcore/health"
            tail -60 msd_launch.log
            kill $APP_PID 2>/dev/null
            exit 1
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8599/")
          kill $APP_PID 2>/dev/null
          echo "main page HTTP $code"
          [ "$code" = "200" ] || exit 1

      - name: Build DMG
        run: |
          mkdir -p dmg_stage
          cp -R "dist/MeteringStationDesigner.app" dmg_stage/
          ln -s /Applications dmg_stage/Applications
          hdiutil create -volname "MeteringStationDesigner" -srcfolder dmg_stage -ov -format UDZO MeteringStationDesigner_macOS_arm64.dmg
          ls -la MeteringStationDesigner_macOS_arm64.dmg

      - name: Upload to Release
        run: |
          tag="${{ github.ref_name }}"
          echo "Uploading to release tag: $tag"
          release=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag")
          upload_url=$(echo "$release" | python -c "import sys,json;print(json.load(sys.stdin)['upload_url'].split('{')[0])")
          curl -s -X POST "$upload_url?name=MeteringStationDesigner_macOS_arm64.dmg" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/x-apple-diskimage" \
            --data-binary "@MeteringStationDesigner_macOS_arm64.dmg"